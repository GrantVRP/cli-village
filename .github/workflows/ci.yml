# Checks every pull request and every change to main on Linux, macOS and
# Windows, with the Node.js versions CLI Village supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the checks never change the repository. Actions are pinned to commits (the
# comment says which version); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Let every combination finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 22.12+ is the oldest CLI Village supports (ink and commander need it); 24 is the newest LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds first (pretest), then runs every test in test/.
      - run: npm test

  # Opens the real desktop app and clicks through it (npm run test:app). Windows first, where
  # it has been tried by hand; Linux and macOS can follow. Electron (about 100 MB) downloads
  # the first time the test asks for it, so only this job fetches it.
  app:
    name: Desktop app · windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:app
