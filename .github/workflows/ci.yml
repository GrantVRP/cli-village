# Checks every pull request and every change to main on Linux, macOS and
# Windows, with the Node.js versions CLI Village supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the checks never change the repository.
permissions:
  contents: read

# The tests never open the desktop app, so skip Electron's 100 MB download.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Let every combination finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 22.12+ is the oldest CLI Village supports (ink and commander need it); 24 is the newest LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds first (pretest), then runs every test in test/.
      - run: npm test
