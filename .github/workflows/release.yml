# Builds the desktop app's installers on Windows, macOS and Linux, and tests the Windows app.
#
# - On a pull request that changes the app or its packaging: builds them, so a broken
#   installer shows up before it's merged. They're kept for 7 days under the run's Artifacts.
# - On a version tag (v1.2.3): also drafts a GitHub release with the installers, their
#   SHA-256 checksums, a list of what's inside (SBOM) and a signed record of where and how
#   they were built (attestation). Then, once the owner approves the `npm` environment, it
#   publishes the npm package, with provenance and without any stored token.
#
# docs/RELEASING.md has the steps. Actions are pinned to commits (the comment says which
# version); Dependabot keeps them current.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - electron-builder.yml
      - desktop/**
      - src/app/**
      - app/**
      - package.json
      - package-lock.json
      - test/app/installed.test.mjs
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default: each job asks for only what it needs.
permissions: {}

jobs:
  desktop:
    name: Installers · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json's version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::The tag is $TAG but package.json says $VERSION."
            exit 1
          fi
      # With install scripts: Linux has no prebuilt node-pty, so it's compiled here.
      - run: npm ci
      - run: npm run build
      - name: Build the installers
        run: npx electron-builder --publish never
      - name: Test the installed app (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-reporter=spec --test-timeout=300000 test/app/installed.test.mjs
        env:
          CLI_VILLAGE_TEST_INSTALLED_APP: ${{ github.workspace }}\release\win-unpacked\CLI Village.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            !release/__uninstaller*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the GitHub release
    if: github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation (Sigstore, through GitHub)
      attestations: write # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      - name: List what's inside (SBOM) and the checksums
        run: |
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > out/sbom.cdx.json
          cd out
          ls | grep -vx SHA256SUMS | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where and how the files were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*
      - name: Draft the release (the owner reviews and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          What changed: see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md).

          **Install:** the command line with \`npm install -g cli-village\`; the desktop app from the files below.
          These installers aren't signed yet, so Windows and macOS warn the first time: the README's
          [Install](https://github.com/${GITHUB_REPOSITORY}#install) section says what to click.

          **Check a download** (optional): \`gh attestation verify FILE -R ${GITHUB_REPOSITORY}\`, or compare
          its SHA-256 with SHA256SUMS.
          EOF
          gh release create "$TAG" out/* --draft --verify-tag --title "CLI Village $TAG" --notes-file notes.md

  npm:
    name: Publish to npm
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for the owner's approval (Settings › Environments › npm › Required reviewers).
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing: npm checks this workflow's identity, no token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No install scripts in the one job that can publish: no dependency's code runs here.
      - run: npm ci --ignore-scripts
      - run: npm test
      # prepack builds again, from this checkout.
      - run: npm publish
